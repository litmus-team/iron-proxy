name: Build & Release

on:
  push:
    tags:
      - "v*"
  pull_request:
    branches: [main]

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    env:
      # Tag pushes cut a real release; anything else (PRs) is a snapshot build.
      RELEASE_TAG: ${{ startsWith(github.ref, 'refs/tags/v') }}
      # THE single source of truth for Docker Hub. Only upstream-shaped release
      # tags (vX.Y.Z, no pre-release suffix) can push to ironsh/iron-proxy.
      # Hyphenated tags - this fork's v0.31.0-litmus.N, upstream's v*-rc.N - have
      # no credentials for that namespace, so they publish archives + checksums
      # only. This one value drives BOTH the login below and GoReleaser's
      # --skip=docker, so the guard and the publish cannot drift apart again.
      DOCKER_PUSH: ${{ startsWith(github.ref, 'refs/tags/v') && !contains(github.ref, '-') }}
    steps:
      - uses: actions/checkout@de0fac2e4500dabe0009e67214ff5f5447ce83dd # v6.0.2
        with:
          fetch-depth: 0

      - uses: ironsh/iron-proxy-action@fa1fd82ec32396d044deba7040a6db576bec927a # v0.1.4
        with:
          egress-rules: egress-rules.yaml
          disable-docker: false

      - uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version: "1.26"

      - name: Set up QEMU
        uses: docker/setup-qemu-action@ce360397dd3f832beb865e1373c09c0e9f86d70a # v4.0.0

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@4d04d5d9486b7bd6fa91e7baf45bbb4f8b9deedd # v4.0.0

      - name: Log in to Docker Hub
        if: env.DOCKER_PUSH == 'true'
        uses: docker/login-action@4907a6ddec9925e35a0a9e82d7399ccc52663121 # v4.1.0
        with:
          username: ${{ secrets.DOCKER_HUB_USERNAME }}
          password: ${{ secrets.DOCKER_HUB_TOKEN }}

      - name: Run GoReleaser
        uses: goreleaser/goreleaser-action@1a80836c5c9d9e5755a25cb59ec6f45a3b5f41a8 # v7.2.1
        with:
          version: latest
          args: >-
            release
            ${{ env.RELEASE_TAG != 'true' && '--snapshot' || '' }}
            ${{ env.RELEASE_TAG == 'true' && env.DOCKER_PUSH != 'true' && '--skip=docker' || '' }}
            --clean
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - uses: ironsh/iron-proxy-action/summary@fa1fd82ec32396d044deba7040a6db576bec927a # v0.1.4
        if: always()
